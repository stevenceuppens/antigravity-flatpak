name: Build and Validate Flatpaks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build ${{ matrix.app-id }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-45
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - app-id: org.google.Antigravity
            manifest: antigravity/org.google.Antigravity.yml
          - app-id: org.google.AntigravityIDE
            manifest: antigravity-ide/org.google.AntigravityIDE.yml

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4


    - name: Setup Flatpak Builder
      uses: flatpak/flatpak-github-actions/flatpak-builder@v6
      with:
        bundle: ${{ matrix.app-id }}.flatpak
        manifest-path: ${{ matrix.manifest }}
        cache: true
        cache-key: flatpak-builder-${{ matrix.app-id }}-${{ hashFiles(matrix.manifest) }}
        run-tests: false
